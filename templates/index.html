{% extends "base.html" %}
{% block body_class %}home-bg{% endblock %}

{% block content %}
<div class="container mt-4">

  <!-- Stats Cards -->
  <div class="row mb-4">
    <div class="col-md-4 mb-3">
      <div class="card text-white bg-primary shadow-sm h-100 card-custom">
        <div class="card-body text-center">
          <h5 class="card-title">Total Patients</h5>
          <h3>{{ total_patients }}</h3>
        </div>
      </div>
    </div>
    <div class="col-md-4 mb-3">
      <div class="card text-white bg-danger shadow-sm h-100 card-custom">
        <div class="card-body text-center">
          <h5 class="card-title">High Risk</h5>
          <h3>{{ high_risk }}</h3>
        </div>
      </div>
    </div>
    <div class="col-md-4 mb-3">
      <div class="card text-white bg-success shadow-sm h-100 card-custom">
        <div class="card-body text-center">
          <h5 class="card-title">Low Risk</h5>
          <h3>{{ low_risk }}</h3>
        </div>
      </div>
    </div>
  </div>

  <!-- Charts -->
  <div class="row">
    <div class="col-md-6 mb-4">
      <div class="card shadow-sm p-3 card-custom">
        <h5 class="text-center mb-3">Risk Proportion</h5>
        <canvas id="riskPieChart"></canvas>
      </div>
    </div>
    <div class="col-md-6 mb-4">
      <div class="card shadow-sm p-3 card-custom">
        <h5 class="text-center mb-3">Average Age by Risk Level</h5>
        <canvas id="ageBarChart"></canvas>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  // Pass Flask data to JS safely
  const highRisk = {{ high_risk | default(0) }};
  const lowRisk = {{ low_risk | default(0) }};
  const avgAgeByRisk = {{ avg_age_by_risk | default({"Yes":0,"No":0}) | tojson }};

  // Pie Chart
  const pieCtx = document.getElementById('riskPieChart').getContext('2d');
  new Chart(pieCtx, {
      type: 'pie',
      data: {
          labels: ['High Risk', 'Low Risk'],
          datasets: [{
              data: [highRisk, lowRisk],
              backgroundColor: ['#dc3545','#28a745']
          }]
      },
      options: { responsive: true }
  });

  // Bar Chart
  const barCtx = document.getElementById('ageBarChart').getContext('2d');
  new Chart(barCtx, {
      type: 'bar',
      data: {
          labels: Object.keys(avgAgeByRisk),
          datasets: [{
              label: 'Average Age',
              data: Object.values(avgAgeByRisk),
              backgroundColor: ['#ffc107','#17a2b8']
          }]
      },
      options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true } }
      }
  });
</script>
{% endblock %}
